name: Publish GHCR image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable release tag to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate source
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn test
          yarn lint

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | \
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish image
        env:
          IMAGE: ghcr.io/svidify-sarl/export-html:${{ inputs.image_tag }}
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" --tag "$IMAGE" .
          docker push "$IMAGE"
